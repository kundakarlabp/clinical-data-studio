name: PostgreSQL Test Diagnostic

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinical
          POSTGRES_DB: clinical_data_studio_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical -d clinical_data_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CDS_ENV: development
      CDS_HOST: 127.0.0.1
      CDS_DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://clinical@127.0.0.1:5432/clinical_data_studio_test
      CDS_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Migrate
        run: python server.py migrate
      - name: Run tests and retain log
        id: tests
        continue-on-error: true
        run: python -W error::ResourceWarning -m unittest discover -s tests > postgres-tests.log 2>&1
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-diagnostic
          path: postgres-tests.log
          retention-days: 2
      - name: Propagate test result
        if: steps.tests.outcome != 'success'
        run: exit 1
